# Publica o jogo no GitHub Pages a cada push na main (depois de passar nos testes).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (só o que o navegador usa)
        run: mkdir _site && cp -r index.html manifest.webmanifest css img core ui _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # #300: o GitHub às vezes falha ao ler o artefato recém-enviado; uma nova tentativa um minuto depois resolve
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
